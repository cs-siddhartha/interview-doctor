[project]
name = "interview-doctor-backend"
version = "0.1.0"
description = "FastAPI backend for Interview Doctor"
requires-python = ">=3.12"
dependencies = [
  "docling>=2.70.0",
  "fastapi>=0.115.0",
  "pydantic>=2.10.0",
  "python-dotenv>=1.1.0",
  "python-multipart>=0.0.20",
  "redis>=5.2.0",
  "redisvl>=0.12.0",
  "tiktoken>=0.12.0",
  "torch>=2.2.0",
  "torchvision>=0.28.0",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.9.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
